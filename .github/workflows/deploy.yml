name: Deploy Gestao

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar projeto
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package

      - name: Exibir relatórios de teste em caso de falha
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done

      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Salva a chave: substitui \n literais por newlines reais
          # (caso o secret tenha sido colado em uma única linha com \n escapados)
          echo "$VPS_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          # Garante newline no final do arquivo
          echo >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Diagnóstico: mostra header/footer da chave sem expor o conteúdo
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enviar JAR para o servidor
        run: |
          scp -P "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            target/gestao-0.0.1-SNAPSHOT.jar \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/lib/gestao-deploy/gestao.jar"

      - name: Reiniciar aplicação
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/local/sbin/deploy-gestao"